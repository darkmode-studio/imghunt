name: Build imghunt APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imghunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test gateway with mocked upstream
        working-directory: backend
        run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-results
          path: backend/test-results.xml
          if-no-files-found: warn
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run unit tests and compile device tests
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon
      - name: Build Debug and Release beta APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: imghunt-beta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: imghunt-beta-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
